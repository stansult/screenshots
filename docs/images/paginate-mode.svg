      <rect x="11" y="338" width="118" height="70" rx="5" fill="#fff8c5"/><rect x="11" y="423" width="84" height="7" rx="3.5" fill="#afb8c1"/><rect x="11" y="441" width="118" height="7" rx="3.5" fill="#d0d7de"/><rect x="11" y="459" width="102" height="7" rx="3.5" fill="#d0d7de"/><rect x="11" y="484" width="118" height="20" rx="5" fill="#ddf4ff"/>
