<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Appearance options</title>
  <desc id="desc">One screenshot shown with whitespace retained, trimmed, bordered, and shadowed.</desc>
  <rect width="1200" height="420" rx="24" fill="#f6f8fa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="175" y="48" text-anchor="middle" font-size="20" font-weight="600" fill="#57606a">SOURCE IMAGE</text>
    <text x="820" y="48" text-anchor="middle" font-size="20" font-weight="600" fill="#57606a">APPEARANCE OPTIONS</text>

    <g transform="translate(108 92)">
      <rect width="134" height="230" rx="8" fill="#fff" stroke="#8c959f" stroke-width="3"/>
      <rect x="20" y="28" width="94" height="174" rx="6" fill="#ddf4ff"/>
      <rect x="31" y="43" width="72" height="60" rx="5" fill="#80ccff"/>
      <rect x="31" y="119" width="53" height="7" rx="3.5" fill="#54aeff"/>
      <rect x="31" y="137" width="72" height="7" rx="3.5" fill="#b6e3ff"/>
      <rect x="31" y="155" width="63" height="7" rx="3.5" fill="#b6e3ff"/>
      <path d="M20 28h94v174H20z" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="6 5"/>
    </g>
    <text x="175" y="353" text-anchor="middle" font-size="16" fill="#57606a">removable whitespace</text>

    <path d="M290 210h100m-18-18 18 18-18 18" fill="none" stroke="#57606a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(445 92)">
      <rect width="134" height="230" rx="8" fill="#fff" stroke="#8c959f" stroke-width="3"/>
      <rect x="20" y="28" width="94" height="174" rx="6" fill="#ddf4ff"/>
      <rect x="31" y="43" width="72" height="60" rx="5" fill="#80ccff"/>
      <rect x="31" y="119" width="53" height="7" rx="3.5" fill="#54aeff"/><rect x="31" y="137" width="72" height="7" rx="3.5" fill="#b6e3ff"/><rect x="31" y="155" width="63" height="7" rx="3.5" fill="#b6e3ff"/>
    </g>
    <text x="512" y="353" text-anchor="middle" font-size="17" font-weight="700" fill="#0969da">--no-trim</text>
    <text x="512" y="377" text-anchor="middle" font-size="15" fill="#57606a">whitespace remains</text>

    <g transform="translate(645 120)">
      <rect width="94" height="174" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
      <rect x="11" y="15" width="72" height="60" rx="5" fill="#80ccff"/>
      <rect x="11" y="91" width="53" height="7" rx="3.5" fill="#54aeff"/><rect x="11" y="109" width="72" height="7" rx="3.5" fill="#b6e3ff"/><rect x="11" y="127" width="63" height="7" rx="3.5" fill="#b6e3ff"/>
    </g>
    <text x="692" y="353" text-anchor="middle" font-size="17" font-weight="700" fill="#0969da">--trim</text>
    <text x="692" y="377" text-anchor="middle" font-size="15" fill="#57606a">whitespace removed</text>

    <g transform="translate(810 114)">
      <rect width="106" height="186" rx="8" fill="#24292f"/>
      <rect x="6" y="6" width="94" height="174" rx="5" fill="#ddf4ff"/>
      <rect x="17" y="21" width="72" height="60" rx="5" fill="#80ccff"/>
      <rect x="17" y="97" width="53" height="7" rx="3.5" fill="#54aeff"/><rect x="17" y="115" width="72" height="7" rx="3.5" fill="#b6e3ff"/><rect x="17" y="133" width="63" height="7" rx="3.5" fill="#b6e3ff"/>
    </g>
    <text x="863" y="353" text-anchor="middle" font-size="17" font-weight="700" fill="#0969da">--border 6</text>
    <text x="863" y="377" text-anchor="middle" font-size="15" fill="#57606a">border added</text>

    <rect x="1007" y="134" width="94" height="174" rx="6" fill="#57606a" opacity=".38"/>
    <g transform="translate(995 120)">
      <rect width="94" height="174" rx="6" fill="#ddf4ff"/>
      <rect x="11" y="15" width="72" height="60" rx="5" fill="#80ccff"/>
      <rect x="11" y="91" width="53" height="7" rx="3.5" fill="#54aeff"/><rect x="11" y="109" width="72" height="7" rx="3.5" fill="#b6e3ff"/><rect x="11" y="127" width="63" height="7" rx="3.5" fill="#b6e3ff"/>
    </g>
    <text x="1042" y="353" text-anchor="middle" font-size="17" font-weight="700" fill="#0969da">--shadow</text>
